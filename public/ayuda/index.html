<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Centro de ayuda de VG · plantilla común (R-AYUDA). La misma página, byte a byte, en todos los productos: el
     nombre, los actores y los botones salen de ayuda.json, y ayuda.js pone el título del producto. -->
<title>Ayuda en video · Visión Geográfica™</title>
<meta name="description" content="Videos cortos de cada flujo, con su paso a paso escrito.">
<meta name="theme-color" content="#0A1128">
<link rel="icon" type="image/png" href="vg-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Íconos con display=block (#17, 31-oct): con swap se lee la palabra «description» mientras carga la fuente. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="ayuda.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <!-- Logo oficial con ™ (#02, 31-oct), copiado de www.visiongeografica.com/brand/ junto a la página. -->
      <picture id="logo"><source srcset="vg-logo-tm-oscuro.png" media="(prefers-color-scheme: dark)"><img class="logo" src="vg-logo-tm-claro.png" alt="Visión Geográfica™" width="129" height="32"></picture>
      <div><div class="brand-name" id="marca">Centro de ayuda</div>
      <div class="brand-sub">cada flujo en un video corto y su paso a paso</div></div>
    </div>
    <nav class="nav" id="enlaces" aria-label="Producto"></nav>
  </header>

  <main class="contenido">
    <div class="card">
      <p class="entrada" id="entrada">Cada flujo trae un video corto con subtítulos, que se entiende sin sonido, y el mismo paso a paso escrito.</p>
      <label class="buscar">Buscar
        <input id="q" type="search" placeholder="" autocomplete="off">
      </label>
      <p class="conteo" id="conteo"></p>
      <div class="actores" id="actores" role="group" aria-label="Filtrar por actor"></div>
    </div>
    <div id="contenido"><p class="vacio">Cargando la ayuda…</p></div>
  </main>

  <footer id="pie">Visión Geográfica™</footer>
</div>

<script src="ayuda.js" defer></script>
</body>
</html>
